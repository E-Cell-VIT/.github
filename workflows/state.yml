name: Manage Stale Issues

on:
  schedule:
    - cron: "30 18 * * *"
  workflow_dispatch:

permissions:
  issues: write
  pull-requests: write

jobs:
  stale:
    runs-on: ubuntu-latest

    steps:
      - name: Mark stale issues and pull requests
        uses: actions/stale@v10
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}

          stale-issue-message: >
            This issue has been inactive for a while.
            It will be closed if there is no further activity.
            If this is still relevant, please provide an update.

          close-issue-message: >
            This issue has been automatically closed due to prolonged inactivity.
            Feel free to reopen or create a new issue if the problem is still relevant.

          stale-pr-message: >
            This pull request has been inactive for a while.
            Please provide an update if work is still ongoing.

          close-pr-message: >
            This pull request has been automatically closed due to prolonged inactivity.
            Please reopen or create a new pull request if the work is still relevant.

          days-before-stale: 45
          days-before-close: 14

          stale-issue-label: "status:stale"
          stale-pr-label: "status:stale"

          exempt-issue-labels: "priority:critical,priority:high"
          exempt-pr-labels: "priority:critical,priority:high"