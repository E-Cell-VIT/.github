name: Bug Report
description: Report a reproducible problem in an E-Cell VIT Mumbai project.
title: "[Bug]: "
labels:
  - "type:bug"
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a bug.

        Please provide enough information for a maintainer to reproduce and investigate the problem.

        Do not include passwords, API keys, access tokens, or other secrets.

  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: Clearly describe the problem.
      placeholder: Tell us what went wrong.
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: What did you expect to happen?
      placeholder: Describe the expected behaviour.
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      description: Provide the smallest reproducible sequence of steps.
      placeholder: |
        1. Open...
        2. Configure...
        3. Run...
        4. Observe...
    validations:
      required: true

  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Include relevant versions and platform information.
      placeholder: |
        OS:
        Browser:
        Runtime:
        Framework:
        Version/commit:

  - type: textarea
    id: logs
    attributes:
      label: Logs or error output
      description: Remove all secrets and sensitive information before submitting.
      render: shell

  - type: textarea
    id: screenshots
    attributes:
      label: Screenshots or recordings
      description: Add visual evidence if useful.

  - type: textarea
    id: additional-context
    attributes:
      label: Additional context
      description: Anything else maintainers should know?

  - type: checkboxes
    id: checks
    attributes:
      label: Checks
      options:
        - label: I searched existing issues and did not find a duplicate.
          required: true
        - label: I have removed passwords, API keys, tokens, and other secrets.
          required: true
        - label: I have provided enough information to reproduce the issue.
          required: true